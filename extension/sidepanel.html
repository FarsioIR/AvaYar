<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>آوایار</title>

  <link
    rel="stylesheet"
    href="sidepanel.css"
  />
</head>

<body>
  <main class="app">

    <header class="brand">
      <img
        src="assets/avayar-flat.svg"
        alt="نشان آوایار"
      />

      <div>
        <span class="brand-parent">
          فارسیو
        </span>

        <h1>آوایار</h1>

        <p>
          دستیار هوشمند شنیدن
        </p>
      </div>
    </header>

    <section class="hero">
      <h2>
        بخوان، خلاصه کن و بشنو
      </h2>

      <p>
        محتوای فارسی یا انگلیسی همین صفحه را
        به فارسی آماده کن و با صدای دلخواه بشنو.
      </p>

      <button
        id="extract"
        class="primary"
        type="button"
      >
        خواندن این صفحه
      </button>
    </section>

    <section
      class="preferences"
      aria-label="تنظیمات خواندن"
    >
      <label>
        <span>
          حالت خواندن
        </span>

        <select id="mode">
          <option value="full">
            متن کامل
          </option>

          <option value="summary">
            خلاصه
          </option>
        </select>
      </label>

      <label>
        <span>
          صدا
        </span>

        <select id="voice">
          <option value="female">
            صدای زن
          </option>

          <option value="male">
            صدای مرد
          </option>
        </select>
      </label>
    </section>

    <p
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    >
      آماده‌ام. یک صفحه وب را باز کن و «خواندن این صفحه» را بزن.
    </p>

    <section
      class="reader"
      aria-live="polite"
    >
      <div class="reader-header">
        <span id="modeBadge">
          متن کامل
        </span>

        <h2 id="title">
          هنوز صفحه‌ای انتخاب نشده
        </h2>
      </div>

      <div id="output">
        <p class="empty">
          متن آماده‌شده اینجا نمایش داده می‌شود.
        </p>
      </div>
    </section>

    <section
      class="player"
      aria-label="کنترل پخش"
    >
      <button
        id="play"
        class="primary"
        type="button"
        disabled
      >
        پخش
      </button>

      <button
        id="pause"
        type="button"
        disabled
      >
        مکث
      </button>

      <button
        id="stop"
        type="button"
        disabled
      >
        توقف
      </button>

      <audio id="audio"></audio>
    </section>

  </main>

  <script
    type="module"
    src="sidepanel.mjs"
  ></script>
</body>
</html>
