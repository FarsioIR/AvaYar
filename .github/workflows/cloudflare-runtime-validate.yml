name: AvaYar Cloudflare Runtime Validate

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-runtime-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full repository quality gate
        run: npm run check
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run
