name: AvaYar Cloudflare Preview Deploy

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "extension/**"
      - "scripts/**extension**"
      - "package.json"
      - ".github/workflows/cloudflare-preview-deploy.yml"
  workflow_dispatch:
    inputs:
      rc_label:
        description: "RC label for the preview deployment"
        required: false
        default: "preview"
        type: string

permissions:
  contents: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: avayar-preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Full AvaYar quality gate
        run: npm run check

      - name: Validate Cloudflare bundle and bindings
        run: npx --yes wrangler@latest deploy --name avayar-runtime-preview --dry-run

      - name: Deploy isolated preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --name avayar-runtime-preview

      - name: Normalize deployment URL
        id: runtime
        shell: bash
        env:
          RAW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [ -z "$RAW_URL" ]; then
            echo "Cloudflare did not return a deployment URL." >&2
            exit 1
          fi
          URL="${RAW_URL#http://}"
          URL="${URL#https://}"
          URL="${URL%% *}"
          URL="${URL%/}"
          URL="https://${URL}"
          if [[ ! "$URL" =~ ^https://[^/]+$ ]]; then
            echo "Invalid deployment URL: $RAW_URL" >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "AvaYar preview runtime: $URL"

      - name: Smoke test preview health
        env:
          RUNTIME_URL: ${{ steps.runtime.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$RUNTIME_URL/health" \
              | node -e '
                let body="";
                process.stdin.on("data", chunk => body += chunk);
                process.stdin.on("end", () => {
                  const value = JSON.parse(body);
                  if (value.ok !== true || value.status !== "ready" || value.product !== "AvaYar") process.exit(1);
                  if (value.capabilities?.translation !== "cloudflare-workers-ai") process.exit(1);
                  console.log("Preview health PASS", value);
                });
              '
            then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Preview health did not become ready." >&2
          exit 1

      - name: E2E smoke English to Persian translation
        env:
          RUNTIME_URL: ${{ steps.runtime.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 \
            -H 'content-type: application/json' \
            --data '{"text":"Technology helps people read and understand useful information."}' \
            "$RUNTIME_URL/api/translate" \
            | node -e '
              let body="";
              process.stdin.on("data", chunk => body += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(body);
                if (typeof value.text !== "string" || !/[\u0600-\u06ff]/u.test(value.text)) process.exit(1);
                if (value.provider !== "cloudflare-m2m100") process.exit(1);
                console.log("Translation E2E PASS", { provider: value.provider, text: value.text });
              });
            '

      - name: E2E smoke speech fallback contract
        env:
          RUNTIME_URL: ${{ steps.runtime.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 15 -o /tmp/tts.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"text":"سلام از آوایار","voicePreference":"female"}' \
            "$RUNTIME_URL/api/tts")"
          test "$status" = "503"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync("/tmp/tts.json", "utf8"));
            if (value.code !== "AVAYAR_SPEECH_BROWSER_FALLBACK_REQUIRED") process.exit(1);
            console.log("Speech browser-fallback contract PASS");
          '

      - name: Resolve RC metadata
        id: rc
        shell: bash
        env:
          INPUT_LABEL: ${{ inputs.rc_label }}
        run: |
          set -euo pipefail
          LABEL="${INPUT_LABEL:-preview-${GITHUB_RUN_NUMBER}}"
          SAFE_LABEL="$(printf '%s' "$LABEL" | tr -cs 'A-Za-z0-9._-' '-')"
          SAFE_LABEL="${SAFE_LABEL%-}"
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVE="avayar-${VERSION}-${SAFE_LABEL}-chrome-edge.zip"
          TAG="avayar-v${VERSION}-${SAFE_LABEL}"
          echo "label=$SAFE_LABEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and validate installable Extension RC
        env:
          AVAYAR_PRODUCTION_API_BASE: ${{ steps.runtime.outputs.url }}
          AVAYAR_RC_LABEL: ${{ steps.rc.outputs.label }}
        run: npm run check:extension:rc

      - name: Package Chrome and Edge RC
        shell: bash
        env:
          ARCHIVE: ${{ steps.rc.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p dist-rc
          (cd dist-extension && zip -qr "../dist-rc/${ARCHIVE}" .)
          sha256sum "dist-rc/${ARCHIVE}" > "dist-rc/${ARCHIVE}.sha256"
          unzip -p "dist-rc/${ARCHIVE}" manifest.json | node -e '
            let body="";
            process.stdin.on("data", c => body += c);
            process.stdin.on("end", () => {
              const manifest = JSON.parse(body);
              if (manifest.manifest_version !== 3) process.exit(1);
              console.log(`Verified Manifest V${manifest.manifest_version}, version ${manifest.version}`);
            });
          '

      - name: Upload installable RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: avayar-extension-${{ steps.rc.outputs.label }}
          path: |
            dist-rc/*.zip
            dist-rc/*.sha256
            dist-rc/rc-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rc.outputs.tag }}
          VERSION: ${{ steps.rc.outputs.version }}
          LABEL: ${{ steps.rc.outputs.label }}
          ARCHIVE: ${{ steps.rc.outputs.archive }}
          RUNTIME_URL: ${{ steps.runtime.outputs.url }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist-rc/${ARCHIVE}" \
            "dist-rc/${ARCHIVE}.sha256" \
            "dist-rc/rc-metadata.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AvaYar ${VERSION} ${LABEL}" \
            --notes "Preview-validated Chrome/Edge RC. Runtime: ${RUNTIME_URL}. English→Persian Workers AI E2E: PASS. Browser speech fallback contract: PASS. Production remains unchanged." \
            --prerelease

      - name: Write deployment summary
        env:
          RUNTIME_URL: ${{ steps.runtime.outputs.url }}
          RC_LABEL: ${{ steps.rc.outputs.label }}
          ARCHIVE: ${{ steps.rc.outputs.archive }}
          TAG: ${{ steps.rc.outputs.tag }}
        shell: bash
        run: |
          {
            echo "## AvaYar Preview + RC"
            echo
            echo "- Runtime: \`$RUNTIME_URL\`"
            echo "- Health: PASS"
            echo "- English → Persian: PASS via Workers AI M2M100"
            echo "- Speech fallback contract: PASS"
            echo "- Installable RC: \`$ARCHIVE\`"
            echo "- GitHub prerelease tag: \`$TAG\`"
            echo "- Production: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
