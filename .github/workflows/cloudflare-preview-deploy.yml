name: AvaYar Cloudflare Preview Deploy

on:
  workflow_dispatch:
    inputs:
      rc_label:
        description: "RC label for the preview deployment"
        required: false
        default: "preview"
        type: string

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: avayar-preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Full AvaYar quality gate
        run: npm run check

      - name: Validate Cloudflare bundle
        run: npx --yes wrangler@latest deploy --dry-run

      - name: Deploy isolated preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name avayar-runtime-preview

      - name: Normalize deployment URL
        id: runtime
        shell: bash
        env:
          RAW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [ -z "$RAW_URL" ]; then
            echo "Cloudflare did not return a deployment URL." >&2
            exit 1
          fi
          URL="${RAW_URL#http://}"
          URL="${URL#https://}"
          URL="${URL%% *}"
          URL="${URL%/}"
          URL="https://${URL}"
          if [[ ! "$URL" =~ ^https://[^/]+$ ]]; then
            echo "Invalid deployment URL: $RAW_URL" >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "AvaYar preview runtime: $URL"

      - name: Smoke test preview health
        env:
          RUNTIME_URL: ${{ steps.runtime.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$RUNTIME_URL/health" \
              | node -e '
                let body="";
                process.stdin.on("data", chunk => body += chunk);
                process.stdin.on("end", () => {
                  const value = JSON.parse(body);
                  if (value.ok !== true || value.status !== "ready" || value.product !== "AvaYar") {
                    process.exit(1);
                  }
                  console.log("Preview health PASS", value);
                });
              '
            then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Preview health did not become ready." >&2
          exit 1

      - name: Write deployment summary
        env:
          RUNTIME_URL: ${{ steps.runtime.outputs.url }}
          RC_LABEL: ${{ inputs.rc_label }}
        shell: bash
        run: |
          {
            echo "## AvaYar Cloudflare Preview"
            echo
            echo "- Runtime: \`$RUNTIME_URL\`"
            echo "- Health: \`$RUNTIME_URL/health\`"
            echo "- RC label: \`$RC_LABEL\`"
            echo "- Next: migrate and validate required application routes, then use this runtime URL in the Extension RC workflow."
          } >> "$GITHUB_STEP_SUMMARY"
